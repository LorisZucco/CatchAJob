<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Encontre vagas de tecnologia compatíveis com suas habilidades, experiência e área de atuação.">

    <title>CatchaTechJob | Compatibilidade com vagas de tecnologia</title>

    <link rel="stylesheet" href="./assets/style/index.style.css">
</head>

<body>

    <!-- ========================================
         CABEÇALHO
    ========================================= -->

    <header class="cabecalho">

        <h1 class="titulo-principal">
            CatchaTechJob
        </h1>

        <nav class="menu" aria-label="Navegação principal">

            <div class="acoes">

                <button type="button" class="btn-reset" id="btn-reset">
                    Começar novamente
                </button>

                <button type="button" class="btn-candidato" id="btn-candidato">
                    Sou candidato
                </button>

                <button type="button" class="btn-empresa" id="btn-empresa">
                    Empresa
                </button>

            </div>

            <button type="button" class="tema">
                Alterar tema da página
            </button>

        </nav>

        <!-- ========================================
             INFORMAÇÕES DO CLIMA
        ========================================= -->

        <aside class="weather-api" aria-label="Informações meteorológicas" aria-live="polite">
        </aside>

    </header>


    <!-- ========================================
         CONTEÚDO PRINCIPAL
    ========================================= -->

    <main id="conteudo-principal" aria-live="polite">

        <section class="resultado-vagas" id="resultado-vagas">
        </section>

    </main>


    <!-- ========================================
         RODAPÉ
    ========================================= -->

    <footer class="rodape">

        <p>
            CatchaTechJob - Projeto acadêmico
        </p>

    </footer>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="./assets/scripts/main.js" type="module"></script>
